name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check and codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WIRE_SEC_KEY: dummy-ci-key
      SUMIRE_PROFILE: official

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run check

      - name: Codegen drift
        run: |
          npm run gen
          git diff --exit-code packages/protocol/src/gen

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks CLI is free; gitleaks-action needs a paid license for org repos.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan history
        run: gitleaks git --redact --no-banner -v .
