name: CI

on:
  push:
    branches: [main]
    # Push only: "Check and codegen drift" and "Secret scan" are required
    # checks, so a docs-only PR must still run or it waits forever.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

# A new push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check and codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: idoly
          POSTGRES_PASSWORD: idoly_dev_pw
          POSTGRES_DB: idoly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idoly -d idoly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WIRE_SEC_KEY: dummy-ci-key
      SUMIRE_PROFILE: official
      DATABASE_URL: postgres://idoly:idoly_dev_pw@localhost:5432/idoly

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrate
        run: npm run -w packages/server db:migrate

      - run: npm run check

      - name: Codegen drift
        run: |
          npm run gen
          git diff --exit-code packages/protocol/src/gen

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # PRs scan only their own commits; pushes to main scan the full history.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Fetch PR commits
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          git fetch --no-tags --depth="$((PR_COMMITS + 1))" origin "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

      # The gitleaks CLI is free; gitleaks-action needs a paid license for org repos.
      - name: Cache gitleaks
        id: gitleaks-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gitleaks-bin
          key: gitleaks-8.30.1-linux-x64

      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          export PATH="$RUNNER_TEMP/gitleaks-bin:$PATH"
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --redact --no-banner -v --log-opts="$BASE_SHA..HEAD" .
          else
            gitleaks git --redact --no-banner -v .
          fi

  fresh-boot:
    name: Fresh boot (no game data)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: idoly
          POSTGRES_PASSWORD: idoly_dev_pw
          POSTGRES_DB: idoly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idoly -d idoly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WIRE_SEC_KEY: dummy-ci-key
      SUMIRE_PROFILE: sandbox
      DATABASE_URL: postgres://idoly:idoly_dev_pw@localhost:5432/idoly

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: No game data in tree
        run: |
          if [ -e packages/server/src/data/diaries.json ]; then
            echo "unexpected diary catalog in the export" >&2
            exit 1
          fi
          if [ -d captures ]; then
            echo "unexpected captures directory at the repo root" >&2
            exit 1
          fi

      - name: Migrate
        run: npm run -w packages/server db:migrate

      - name: Migrate again (idempotent)
        run: npm run -w packages/server db:migrate

      - name: Smoke fresh boot
        run: npm run -w packages/server smoke:fresh-boot
