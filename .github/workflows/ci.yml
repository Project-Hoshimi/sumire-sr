name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check and codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WIRE_SEC_KEY: dummy-ci-key
      SUMIRE_PROFILE: official

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - run: npm run check

      - name: Codegen drift
        run: |
          npm run gen
          git diff --exit-code packages/protocol/src/gen

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The gitleaks CLI is free; gitleaks-action needs a paid license for org repos.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan history
        run: gitleaks git --redact --no-banner -v .

  fresh-boot:
    name: Fresh boot (no game data)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: idoly
          POSTGRES_PASSWORD: idoly_dev_pw
          POSTGRES_DB: idoly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idoly -d idoly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WIRE_SEC_KEY: dummy-ci-key
      SUMIRE_PROFILE: sandbox
      DATABASE_URL: postgres://idoly:idoly_dev_pw@localhost:5432/idoly

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: No game data in tree
        run: |
          if [ -e packages/server/src/data/diaries.json ]; then
            echo "unexpected diary catalog in the export" >&2
            exit 1
          fi
          if [ -d captures ]; then
            echo "unexpected captures directory at the repo root" >&2
            exit 1
          fi

      - name: Migrate
        run: npm run -w packages/server db:migrate

      - name: Migrate again (idempotent)
        run: npm run -w packages/server db:migrate

      - name: Smoke fresh boot
        run: npm run -w packages/server smoke:fresh-boot
